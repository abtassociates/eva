# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
# system libraries:
#   libcurl -- needed to complete setup-renv
#   libharfbuzz-dev libfribidi-dev -- needed for the textshaping package
#   Also using shinytest2 action to try running test -
# https://cran.r-project.org/web/packages/shinytest2/vignettes/use-ci.html
on:
  pull_request:
    branches: [dev, main]
  
name: Test

jobs:
  test:
    runs-on: ubuntu-22.04
    # runs-on: windows-latest

    name: shiny-test-automation

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'renv'

      # - name: install needed system libs
      #   if: runner.os != 'Windows'
      #   shell: bash
      #   run: |
      #    sudo apt install libcurl4-openssl-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev libwebp-dev
  
      - name: Purge system TBB packages
        run: |
          sudo apt-get purge -y 'libtbb*' || true
          sudo rm -rf /usr/include/tbb /usr/local/include/tbb

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libwebp-dev
  
      - uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 2 # bump cache key to ensure clean slate
  
      - name: Restore dependencies from source
        shell: Rscript {0}
        run: |
          # Set repository to canonical source CRAN
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          # Re-install RcppParallel and qs2 from source to ensure header/library parity
          renv::install(c("RcppParallel@6.2.0", "qs2@0.2.2"), type = "source", rebuild = TRUE)
          renv::restore()
          
      - name: remove max fails
        run: |
          testthat::set_max_fails(Inf)
        shell: Rscript {0}
      
      - uses: rstudio/shinytest2/actions/test-app@v1
        with:
          app-dir: "."
          upload-snapshots: true
          
      - name: Get R version
        id: r-version
        run: echo "R_VERSION=$(Rscript --vanilla -e 'cat(R.version$major, R.version$minor, sep=".")')" >> $GITHUB_ENV
        shell: bash
  
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-${{ env.R_VERSION }}-tests
          path: tests

# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
# system libraries:
#   libcurl -- needed to complete setup-renv
#   libharfbuzz-dev libfribidi-dev -- needed for the textshaping package
#   Also using shinytest2 action to try running test -
# https://cran.r-project.org/web/packages/shinytest2/vignettes/use-ci.html
on:
  pull_request:
    branches: [dev, main]
  
name: Test

jobs:
  test:
    runs-on: ubuntu-22.04
    # runs-on: windows-latest

    name: shiny-test-automation

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: "true"
      RENV_CONFIG_INSTALL_TRANSACTIONAL: "false"
      TESTTHAT_MAX_FAILS: "Inf"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        id: setup-r
        with:
          r-version: 'renv'
          use-public-rspm: false          

      # Prevent ABI mismatches: GHA's Ubuntu runner comes with system Intel TBB headers
      # (/usr/include/tbb). Purging them ensures g++ compiles qs2 exclusively against 
      # RcppParallel's bundled oneTBB headers, avoiding '_ZTIN3tbb4taskE' undefined symbol errors.
      # qs2 was using GitHub's TBB
      - name: Purge system TBB headers
        run: sudo rm -rf /usr/include/tbb /usr/local/include/tbb

      - name: Install system dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libwebp-dev

      - uses: r-lib/actions/setup-renv@v2
      
      - uses: rstudio/shinytest2/actions/test-app@v1
        with:
          app-dir: "."
          upload-snapshots: true
          
      # 4. Upload artifacts on failure (safely captures installed R version)
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-R-${{ steps.setup-r.outputs.installed-r-version }}-tests
          path: tests
